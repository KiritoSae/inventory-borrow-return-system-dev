<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Inventory Management System</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>


<body>


<div class="login-page">

    <div class="login-container">

        <div class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <div class="logo-icon">
                    📦
                </div>

                <h1>
                    Inventory System
                </h1>

                <p>
                    Borrowing & Return Management
                </p>

            </div>


            <!-- ERROR -->

            <div
                id="loginError"
                style="
                    display:none;
                    background:#f8d7da;
                    color:#842029;
                    padding:12px;
                    border-radius:8px;
                    margin-bottom:20px;
                    font-size:14px;
                "
            ></div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Sign In
                </button>


            </form>


            <div class="login-footer">

                Inventory Management System

            </div>


        </div>

    </div>

</div>


<script>

/* =====================================
   DEMO ACCOUNTS
===================================== */

const accounts = [

    {
        username: "admin",
        password: "admin123",
        name: "System Administrator",
        role: "admin"
    },

    {
        username: "user",
        password: "user123",
        name: "Normal User",
        role: "user"
    }

];


/* =====================================
   LOGIN
===================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const error =
                document
                    .getElementById("loginError");


            const account =
                accounts.find(
                    function(user) {

                        return (
                            user.username === username &&
                            user.password === password
                        );

                    }
                );


            /* -----------------------------
               INVALID LOGIN
            ----------------------------- */

            if (!account) {

                error.textContent =
                    "Invalid username or password.";

                error.style.display =
                    "block";

                return;

            }


            /* -----------------------------
               SAVE LOGIN
            ----------------------------- */

            localStorage.setItem(
                "inventoryUser",
                JSON.stringify({
                    username: account.username,
                    name: account.name,
                    role: account.role
                })
            );


            /* -----------------------------
               ROUTE USER
            ----------------------------- */

            if (
                account.role ===
                "admin"
            ) {

                window.location.href =
                    "admin/dashboard.html";

            }

            else {

                window.location.href =
                    "borrower/dashboard.html";

            }

        }
    );

</script>


</body>

</html>
