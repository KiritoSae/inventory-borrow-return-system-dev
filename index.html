<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory Borrowing & Return System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f2;
            color: #26332b;
            min-height: 100vh;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .logo h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6d786f;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d4ddd7;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #198754;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #157347;
        }

        .demo-accounts {
            margin-top: 25px;
            padding: 15px;
            background: #f3f8f4;
            border-radius: 10px;
            font-size: 13px;
        }

        .demo-accounts strong {
            display: block;
            margin-bottom: 8px;
        }

        .error {
            display: none;
            background: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">

            <div class="logo-icon">
                📦
            </div>

            <h1>
                Inventory System
            </h1>

            <p>
                Borrowing & Return Management
            </p>

        </div>


        <div
            id="errorMessage"
            class="error"
        >
            Invalid username or password.
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Sign In
            </button>

        </form>


        <div class="demo-accounts">

            <strong>Demo Accounts</strong>

            Admin:
            <b>admin</b> /
            <b>admin123</b>

            <br>

            User:
            <b>user</b> /
            <b>user123</b>

        </div>

    </div>

</div>


<script>

const accounts = {

    admin: {
        password: "admin123",
        role: "admin",
        name: "System Administrator"
    },

    user: {
        password: "user123",
        role: "user",
        name: "Demo User"
    }

};


document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const error =
            document.getElementById("errorMessage");


        const account = accounts[username];


        if (
            account &&
            account.password === password
        ) {

            localStorage.setItem(
                "inventoryUser",
                JSON.stringify({
                    username: username,
                    role: account.role,
                    name: account.name
                })
            );


            if (account.role === "admin") {

                window.location.href =
                    "admin/dashboard.html";

            } else {

                window.location.href =
                    "user/dashboard.html";

            }

        } else {

            error.style.display = "block";

        }

    });

</script>

</body>
</html>
