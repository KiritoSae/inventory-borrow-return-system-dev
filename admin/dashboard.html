<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Inventory System</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

</head>

<body>

<div class="app-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="logo-icon">
                📦
            </div>

            <div>

                <h2>
                    Inventory
                </h2>

                <p>
                    Management System
                </p>

            </div>

        </div>


        <nav>

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="inventory.html">
                📦 Inventory
            </a>

            <a href="borrowers.html">
                👥 Borrowers
            </a>

            <a href="departments.html">
                🏢 Departments
            </a>

            <a href="../qr/scan.html">
                📷 QR Scanner
            </a>

            <a href="transactions.html">
                📋 Transactions
            </a>

            <a
                href="../index.html"
                onclick="logout()"
            >
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">


        <div class="page-header">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Welcome back,
                    <span id="adminName">
                        Administrator
                    </span>.
                </p>

            </div>

        </div>


        <!-- DASHBOARD CARDS -->

        <div class="dashboard-cards">


            <div class="dashboard-card">

                <h3>
                    Total Items
                </h3>

                <div
                    class="number"
                    id="totalItems"
                >
                    0
                </div>

            </div>


            <div class="dashboard-card success">

                <h3>
                    Available
                </h3>

                <div
                    class="number"
                    id="availableItems"
                >
                    0
                </div>

            </div>


            <div class="dashboard-card">

                <h3>
                    Borrowed
                </h3>

                <div
                    class="number"
                    id="borrowedItems"
                >
                    0
                </div>

            </div>


            <div class="dashboard-card warning">

                <h3>
                    Overdue
                </h3>

                <div
                    class="number"
                    id="overdueItems"
                >
                    0
                </div>

            </div>


        </div>


        <!-- RECENT TRANSACTIONS -->

        <div class="table-container">

            <table class="data-table">

                <thead>

                    <tr>

                        <th>
                            Recent Transaction
                        </th>

                        <th>
                            Item
                        </th>

                        <th>
                            Borrower
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="transactionTable">

                    <tr>

                        <td colspan="4">
                            No transactions yet.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </main>

</div>


<script>

/*
|--------------------------------------------------------------------------
| CHECK LOGIN
|--------------------------------------------------------------------------
*/

const user =
    JSON.parse(
        localStorage.getItem("inventoryUser")
    );


if (!user) {

    window.location.href =
        "../index.html";

}


/*
|--------------------------------------------------------------------------
| CHECK ADMIN
|--------------------------------------------------------------------------
*/

if (
    user &&
    user.role !== "admin"
) {

    window.location.href =
        "../user/dashboard.html";

}


/*
|--------------------------------------------------------------------------
| DISPLAY USER NAME
|--------------------------------------------------------------------------
*/

if (user) {

    document.getElementById(
        "adminName"
    ).textContent = user.name;

}


/*
|--------------------------------------------------------------------------
| LOAD INVENTORY
|--------------------------------------------------------------------------
*/

const items =
    JSON.parse(
        localStorage.getItem("inventoryItems")
    ) || [];


const totalItems =
    items.length;


const availableItems =
    items.filter(
        item => item.status === "Available"
    ).length;


const borrowedItems =
    items.filter(
        item => item.status === "Borrowed"
    ).length;


const overdueItems =
    items.filter(
        item => item.status === "Overdue"
    ).length;


document.getElementById(
    "totalItems"
).textContent = totalItems;


document.getElementById(
    "availableItems"
).textContent = availableItems;


document.getElementById(
    "borrowedItems"
).textContent = borrowedItems;


document.getElementById(
    "overdueItems"
).textContent = overdueItems;


/*
|--------------------------------------------------------------------------
| LOGOUT
|--------------------------------------------------------------------------
*/

function logout() {

    localStorage.removeItem(
        "inventoryUser"
    );

}

</script>

</body>

</html>
