<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory - Inventory System</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <style>
        .content-card {
            background: white;
            border: 1px solid #e4ebe6;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d7e0da;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #198754;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-available {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-borrowed {
            background: #fff3cd;
            color: #856404;
        }

        .status-maintenance {
            background: #e2e3e5;
            color: #41464b;
        }

        .success-message {
            display: none;
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="logo-icon">
                📦
            </div>

            <div>
                <h2>Inventory</h2>
                <p>Management System</p>
            </div>

        </div>

        <nav>

            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a href="inventory.html">
                📦 Inventory
            </a>

            <a href="borrowers.html">
                👥 Borrowers
            </a>

            <a href="departments.html">
                🏢 Departments
            </a>

            <a href="../qr/scan.html">
                📷 QR Scanner
            </a>

            <a href="transactions.html">
                📋 Transactions
            </a>

            <a
                href="../index.html"
                onclick="logout()"
            >
                🚪 Logout
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <div class="page-header">

            <div>

                <h1>
                    Inventory
                </h1>

                <p>
                    Manage company inventory items.
                </p>

            </div>

        </div>


        <!-- ADD ITEM -->

        <div class="content-card">

            <h2 style="margin-bottom:20px;">
                Add Inventory Item
            </h2>

            <div
                id="successMessage"
                class="success-message"
            >
                Item added successfully.
            </div>


            <form id="itemForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Item Name
                        </label>

                        <input
                            type="text"
                            id="itemName"
                            class="form-control"
                            placeholder="e.g. Dell Laptop"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            class="form-control"
                            placeholder="e.g. Computer Equipment"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Quantity
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            class="form-control"
                            min="1"
                            value="1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            class="form-control"
                            placeholder="e.g. IT Office"
                            required
                        >

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    + Add Item
                </button>

            </form>

        </div>


        <!-- INVENTORY TABLE -->

        <div class="content-card">

            <h2 style="margin-bottom:20px;">
                Inventory Items
            </h2>


            <div class="table-container">

                <table class="data-table">

                    <thead>

                        <tr>

                            <th>
                                Item ID
                            </th>

                            <th>
                                Item
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Quantity
                            </th>

                            <th>
                                Location
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="inventoryTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

/* ==============================
   LOGIN CHECK
============================== */

const user =
    JSON.parse(
        localStorage.getItem("inventoryUser")
    );


if (
    !user ||
    user.role !== "admin"
) {

    window.location.href =
        "../index.html";

}


/* ==============================
   INVENTORY DATA
============================== */

let items =
    JSON.parse(
        localStorage.getItem("inventoryItems")
    ) || [];


/* ==============================
   SAVE DATA
============================== */

function saveItems() {

    localStorage.setItem(
        "inventoryItems",
        JSON.stringify(items)
    );

}


/* ==============================
   GENERATE ITEM ID
============================== */

function generateItemId() {

    let number = items.length + 1;

    let id =
        "ITEM-" +
        String(number).padStart(4, "0");


    while (
        items.some(item => item.id === id)
    ) {

        number++;

        id =
            "ITEM-" +
            String(number).padStart(4, "0");

    }


    return id;

}


/* ==============================
   DISPLAY INVENTORY
============================== */

function displayItems() {

    const table =
        document.getElementById(
            "inventoryTable"
        );


    table.innerHTML = "";


    if (items.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center;">
                    No inventory items yet.
                </td>
            </tr>
        `;

        return;

    }


    items.forEach(function(item, index) {

        let statusClass =
            "status-available";


        if (item.status === "Borrowed") {

            statusClass =
                "status-borrowed";

        }


        if (item.status === "Maintenance") {

            statusClass =
                "status-maintenance";

        }


        table.innerHTML += `

            <tr>

                <td>
                    <strong>
                        ${item.id}
                    </strong>
                </td>

                <td>
                    ${item.name}
                </td>

                <td>
                    ${item.category}
                </td>

                <td>
                    ${item.quantity}
                </td>

                <td>
                    ${item.location}
                </td>

                <td>

                    <span class="status ${statusClass}">
                        ${item.status}
                    </span>

                </td>

                <td>

                    <button
                        class="btn btn-danger"
                        onclick="deleteItem(${index})"
                    >
                        Delete
                    </button>

                </td>

            </tr>

        `;

    });

}


/* ==============================
   ADD ITEM
============================== */

document
    .getElementById("itemForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const item = {

                id: generateItemId(),

                name:
                    document
                        .getElementById("itemName")
                        .value
                        .trim(),

                category:
                    document
                        .getElementById("category")
                        .value
                        .trim(),

                quantity:
                    Number(
                        document
                            .getElementById("quantity")
                            .value
                    ),

                location:
                    document
                        .getElementById("location")
                        .value
                        .trim(),

                status:
                    "Available",

                createdAt:
                    new Date().toISOString()

            };


            items.push(item);

            saveItems();

            displayItems();


            document
                .getElementById("itemForm")
                .reset();


            document
                .getElementById("quantity")
                .value = 1;


            const message =
                document.getElementById(
                    "successMessage"
                );


            message.style.display =
                "block";


            setTimeout(function() {

                message.style.display =
                    "none";

            }, 3000);

        }
    );


/* ==============================
   DELETE ITEM
============================== */

function deleteItem(index) {

    if (
        !confirm(
            "Are you sure you want to delete this item?"
        )
    ) {

        return;

    }


    items.splice(index, 1);

    saveItems();

    displayItems();

}


/* ==============================
   LOGOUT
============================== */

function logout() {

    localStorage.removeItem(
        "inventoryUser"
    );

}


/* ==============================
   START
============================== */

displayItems();

</script>

</body>

</html>
