<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QR Code Generator - Inventory System</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        .content-card {
            background: white;
            border: 1px solid #e4ebe6;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .qr-form {
            max-width: 600px;
        }

        .qr-preview {
            margin-top: 25px;
            padding: 25px;
            border: 1px dashed #cbd8d0;
            border-radius: 12px;
            text-align: center;
            background: #f8faf9;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        #qrcode img {
            margin: auto;
        }

        .item-info {
            margin-top: 15px;
            color: #536158;
            font-size: 14px;
        }

        .btn-download {
            background: #0f5132;
            color: white;
            margin-top: 10px;
        }

        .btn-download:hover {
            background: #146c43;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            color: #718078;
        }

    </style>

</head>
